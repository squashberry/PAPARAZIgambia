<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebrity review — PAPARAZZI🇬🇲</title><style>*{box-sizing:border-box}body{margin:0;background:#f2efe8;color:#111;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:24px 18px 70px}.top{display:flex;justify-content:space-between;margin-bottom:32px}.brand{font-weight:900;letter-spacing:2px}.card{background:#fff;border:1px solid #ddd;padding:22px;margin:12px 0;display:grid;grid-template-columns:180px 1fr;gap:22px}.card img{width:180px;height:220px;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#777}.tabs{display:flex;gap:8px;overflow:auto}.tabs button,.actions button{padding:11px 14px;border:1px solid #111;background:#fff;font-weight:800}.tabs button.on,.actions .dark{background:#111;color:#fff}.actions{display:flex;gap:8px;margin-top:16px}.links a{display:block;color:#111;margin:5px 0}.empty{padding:40px;background:#fff}@media(max-width:650px){.card{grid-template-columns:1fr}.card img{width:100%;height:260px}.actions{flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><a href="index.html">← PAPARAZZI</a><div class="brand">CELEBRITY DESK</div></div><div class="eyebrow">PAPARAZZI REVIEW</div><h1>Who should we put in the spotlight?</h1><p>Pending applications stay here until a PAPARAZZI approves or refuses them. Refused applications remain available for future review.</p><div class="tabs"><button class="on" data-s="pending">Pending</button><button data-s="refused">Refused</button><button data-s="approved">Approved</button></div><div id="list"></div></div><script>
const API="https://paparazzi-api.squashberrypay.workers.dev";let status="pending";const list=document.getElementById("list");
async function req(path,opt={}){opt.credentials="include";opt.headers={...(opt.headers||{}),"X-Paparazzi-Request":"1"};const r=await fetch(API+path,opt);let d={};try{d=await r.json()}catch(_){ }if(!r.ok)throw Error(d.error||"Access denied");return d}
function esc(x){return String(x||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
async function load(){try{const d=await req("/api/celebrity-applications?status="+status);const rows=d.data||[];list.innerHTML=rows.length?rows.map(x=>"<article class='card'><img src='"+esc(x.main_image_url)+"'><div><div class='eyebrow'>"+esc(x.application_type)+" · "+esc(x.status)+"</div><h2>"+esc(x.stage_name||x.full_name)+"</h2><p><b>"+esc(x.what_you_do)+"</b> · "+esc(x.location)+"</p><p>"+esc(x.about)+"</p><p>"+esc(x.why_feature)+"</p><div class='links'>"+["instagram","tiktok","facebook","youtube","x_handle","other_social","website_url"].filter(k=>x[k]).map(k=>"<a target='_blank' href='"+esc(x[k])+"'>"+k+" ↗</a>").join("")+"</div>"+(status==="pending"?"<div class='actions'><button class='dark' onclick="review('"+x.id+"','approve')">Approve</button><button onclick="review('"+x.id+"','refuse')">Refuse for now</button></div>":"")+"</div></article>").join(""):"<div class='empty'>No "+status+" celebrity applications.</div>"}catch(e){list.innerHTML="<div class='empty'>"+esc(e.message)+"</div>"}}
async function review(id,action){if(!confirm(action==="approve"?"Approve this celebrity application?":"Refuse this application for now?"))return;try{await req("/api/celebrity-applications/"+encodeURIComponent(id)+"/review",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action})});load()}catch(e){alert(e.message)}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");status=b.dataset.s;load()});load();
</script></body></html>

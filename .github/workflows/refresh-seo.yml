name: Refresh PAPARAZZI SEO index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Generate story pages, sitemap and RSS
        env:
          PAPARAZZI_API: https://paparazzi-api.squashberrypay.workers.dev
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const SITE = 'https://squashberry.github.io/PAPARAZZIgambia';
          const API = process.env.PAPARAZZI_API + '/api/articles'
            + '?status=published&limit=50&order=published_at';

          const esc = value => String(value ?? '')
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')
            .replace(/'/g,'&#039;');

          const escText = value => String(value ?? '')
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;');

          const paragraphs = body => String(body || '')
            .split(/\n\s*\n/)
            .map(p => '<p>' + escText(p).replace(/\n/g,'<br>') + '</p>')
            .join('');

          const iso = value => value ? new Date(value).toISOString() : new Date().toISOString();

          const safeSlug = value => String(value || '')
            .toLowerCase()
            .replace(/[^a-z0-9-]+/g,'-')
            .replace(/^-+|-+$/g,'')
            .slice(0,110) || 'story';

          const profileName = row => {
            const p = row.paparazi_profiles;
            return Array.isArray(p) ? (p[0]?.display_name || 'PAPARAZZI🇬🇲') : (p?.display_name || 'PAPARAZZI🇬🇲');
          };

          const profileUser = row => {
            const p = row.paparazi_profiles;
            return Array.isArray(p) ? (p[0]?.username || 'paparazzigambia') : (p?.username || 'paparazzigambia');
          };

          const storyHtml = row => {
            const slug = safeSlug(row.slug);
            const url = SITE + '/stories/' + encodeURIComponent(slug) + '.html';
            const title = row.title || 'PAPARAZZI🇬🇲 Story';
            const description = row.excerpt || String(row.body || '').slice(0,180);
            const author = profileName(row);
            const username = profileUser(row);
            const published = iso(row.published_at || row.created_at);
            const modified = iso(row.updated_at || row.published_at || row.created_at);
            const image = row.cover_url || (SITE + '/og-image.svg');
            const body = paragraphs(row.body);
            const jsonLd = {
              '@context':'https://schema.org',
              '@type':'NewsArticle',
              headline:title,
              description,
              image:[image],
              datePublished:published,
              dateModified:modified,
              author:[{'@type':'Person',name:author}],
              publisher:{
                '@type':'Organization',
                name:'PAPARAZZI🇬🇲',
                url:SITE+'/',
                sameAs:['https://www.tiktok.com/@paparazzigambia?lang=en']
              },
              mainEntityOfPage:url,
              url:url,
              inLanguage:'en-GM',
              articleSection:row.category || 'Story',
              isPartOf:{'@type':'WebSite',name:'PAPARAZZI🇬🇲',url:SITE+'/'}
            };

            return '<!doctype html><html lang="en"><head>'
              + '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              + '<meta name="theme-color" content="#0b0b0b"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">'
              + '<meta name="description" content="'+esc(description)+'"><meta name="author" content="'+esc(author)+'">'
              + '<link rel="canonical" href="'+esc(url)+'"><link rel="icon" href="../favicon.svg">'
              + '<link rel="stylesheet" href="../styles.css">'
              + '<meta property="og:type" content="article"><meta property="og:site_name" content="PAPARAZZI🇬🇲"><meta property="og:locale" content="en_GM">'
              + '<meta property="og:title" content="'+esc(title)+'"><meta property="og:description" content="'+esc(description)+'"><meta property="og:url" content="'+esc(url)+'">'
              + '<meta property="og:image" content="'+esc(image)+'"><meta property="og:image:alt" content="'+esc(title)+'"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">'
              + '<meta property="article:published_time" content="'+esc(published)+'"><meta property="article:modified_time" content="'+esc(modified)+'"><meta property="article:section" content="'+esc(row.category || 'Story')+'">'
              + '<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="'+esc(title)+'"><meta name="twitter:description" content="'+esc(description)+'"><meta name="twitter:image" content="'+esc(image)+'">'
              + '<title>'+esc(title)+' — PAPARAZZI🇬🇲</title>'
              + '<script type="application/ld+json">'+JSON.stringify(jsonLd).replace(/</g,'\\u003c')+'</script>'
              + '</head><body>'
              + '<header class="site-header"><div class="header-inner"><a class="brand" href="../index.html"><div class="brand-mark">PZ</div><div class="brand-copy"><div class="brand-name">PAPARAZZI🇬🇲</div><div class="brand-sub">Seen here first</div></div></a><nav class="nav"><a href="../index.html">HOME</a><a href="../submit.html">SEND A TIP</a><a href="../studio.html">BECOME PAPARAZZI</a><a href="https://www.tiktok.com/@paparazzigambia?lang=en" target="_blank" rel="noopener noreferrer">TIKTOK</a></nav></div></header>'
              + '<main><div class="container story-reader"><div class="story-reader-head"><div class="kicker">'+esc(row.category || 'Story')+'</div><h1>'+esc(title)+'</h1><p class="story-dek">'+esc(description)+'</p><div class="meta" style="margin-top:18px"><strong>'+esc(author)+'</strong><span>•</span><span>'+esc(new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(published)))+'</span></div></div>'
              + '<div class="story-cover">'+(row.cover_url?'<img src="'+esc(row.cover_url)+'" alt="'+esc(title)+'">':'')+'<div class="cover-inner"><div class="cover-words">'+esc(title)+'</div></div></div>'
              + '<div class="story-body">'+body+'</div><div class="author-box"><div class="avatar">'+esc(author.slice(0,2).toUpperCase())+'</div><div><strong>'+esc(author)+'</strong><div style="color:#7f786f;font-size:.82rem">@'+esc(username)+' · PAPARAZZI newsroom</div></div></div>'
              + '<div class="story-next"><button class="btn btn-dark" id="share-story" type="button">Share story →</button><a class="btn btn-ghost" href="../submit.html">Send a tip</a></div></div></main>'
              + '<footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 PAPARAZZI🇬🇲</span><span><a href="https://www.tiktok.com/@paparazzigambia?lang=en" target="_blank" rel="noopener noreferrer">TikTok @paparazzigambia</a></span></div></div></footer>'
              + '<script>document.getElementById("share-story").addEventListener("click",async()=>{try{await navigator.share({title:'+JSON.stringify(title)+',text:'+JSON.stringify(description)+',url:location.href});}catch(e){if(e.name!=="AbortError")await navigator.clipboard?.writeText(location.href);}});</script>'
              + '</body></html> <!-- PAPARAZZI-GENERATED-STORY -->';
          };

          (async()=>{
            const response = await fetch(API);
            if(!response.ok) throw new Error('PAPARAZZI API returned '+response.status);
            const payload = await response.json();
            const rows = payload.data || [];

            const storyDir = path.join(process.cwd(),'stories');
            fs.mkdirSync(storyDir,{recursive:true});

            for(const file of fs.readdirSync(storyDir)){
              if(!file.endsWith('.html')) continue;
              const full=path.join(storyDir,file);
              const text=fs.readFileSync(full,'utf8');
              if(text.includes('PAPARAZZI-GENERATED-STORY')) fs.unlinkSync(full);
            }

            const urls=[
              {url:SITE+'/stories/welcome-to-paparazzi.html'},
              {url:SITE+'/stories/how-paparazzi-works.html'},
              {url:SITE+'/stories/become-a-paparazzi.html'},
              {url:SITE+'/stories/send-a-tip.html'}
            ];
            for(const row of rows){
              const slug=safeSlug(row.slug);
              fs.writeFileSync(path.join(storyDir,slug+'.html'),storyHtml(row));
              urls.push({
                url:SITE+'/stories/'+encodeURIComponent(slug)+'.html',
                lastmod:row.updated_at||row.published_at||row.created_at
              });
            }

            const escXml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');

            const sitemap='<?xml version="1.0" encoding="UTF-8"?>\n'
              +'<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              +urls.map(x=>'  <url><loc>'+escXml(x.url)+'</loc><lastmod>'+escXml(new Date(x.lastmod).toISOString())+'</lastmod><changefreq>daily</changefreq><priority>0.8</priority></url>').join('\n')
              +'\n</urlset>\n';
            fs.writeFileSync('sitemap-stories.xml',sitemap);

            const seedFeed='<item><title>Welcome to PAPARAZZI🇬🇲</title><link>'+SITE+'/stories/welcome-to-paparazzi.html</link><guid isPermaLink="true">'+SITE+'/stories/welcome-to-paparazzi.html</guid><description>A new home for the people, places, parties and moments that make The Gambia impossible to ignore.</description><category>Inside PAPARAZZI</category></item>';
            const feedItems=rows.length?rows.slice(0,30).map(row=>{
              const slug=safeSlug(row.slug);
              const url=SITE+'/stories/'+encodeURIComponent(slug)+'.html';
              return '<item><title>'+escXml(row.title)+'</title><link>'+escXml(url)+'</link><guid isPermaLink="true">'+escXml(url)+'</guid><description>'+escXml(row.excerpt||String(row.body||'').slice(0,180))+'</description><pubDate>'+new Date(row.published_at||row.created_at).toUTCString()+'</pubDate><category>'+escXml(row.category||'Story')+'</category></item>';
            }).join('\n') : seedFeed;
            const feed='<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0"><channel><title>PAPARAZZI🇬🇲</title><link>'+SITE+'/</link><description>The Gambia\'s people-powered social, entertainment, culture, nightlife and style newsroom.</description><language>en-gm</language><image><url>'+SITE+'/og-image.svg</url><title>PAPARAZZI🇬🇲</title><link>'+SITE+'/</link></image>'+feedItems+'</channel></rss>\n';
            fs.writeFileSync('feed.xml',feed);

            console.log('Generated',rows.length,'story pages');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit refreshed SEO files
        run: |
          git config user.name "PAPARAZZI SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add stories sitemap-stories.xml feed.xml
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "Refresh PAPARAZZI story SEO index"
            git push
          fi

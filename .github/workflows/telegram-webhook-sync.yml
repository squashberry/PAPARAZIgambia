name: Sync PAPARAZZI Telegram webhook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Telegram webhook
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30             "https://paparazzi-api.squashberrypay.workers.dev/api/telegram/setup"
          echo

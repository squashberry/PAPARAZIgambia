name: Sync PAPARAZZI Telegram webhook

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile Telegram webhook once
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          setup_url="https://paparazzi-api.squashberrypay.workers.dev/api/telegram/setup?source=github-${GITHUB_RUN_ID}"
          http_status="$(curl --silent --show-error --max-time 30 -o /tmp/setup_body -w '%{http_code}' "$setup_url")"
          body="$(cat /tmp/setup_body)"
          echo "$body" | jq .
          echo "Telegram setup HTTP status: $http_status"
          test "$http_status" = "200"
          webhook_url="$(echo "$body" | jq -r '.webhook_info.url // empty')"
          test -n "$webhook_url"
          [[ "$webhook_url" == */api/telegram/webhook/* ]]
          probe="$(curl --fail --silent --show-error --max-time 30 \
            -X POST -H "Content-Type: application/json" \
            --data "{\"update_id\":${GITHUB_RUN_ID},\"message\":{\"message_id\":1,\"from\":{\"id\":0,\"is_bot\":false,\"first_name\":\"PAPARAZZI Health Check\"},\"chat\":{\"id\":0,\"type\":\"private\"},\"date\":${GITHUB_RUN_ATTEMPT},\"text\":\"/start\"}}" \
            "$webhook_url")"
          echo "Webhook transport probe response: $probe"
          echo "Telegram webhook transport probe: HTTP 200"

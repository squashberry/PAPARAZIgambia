document.addEventListener("DOMContentLoaded",async()=>{
 const root=document.querySelector("#author-root"),api=window.PAPARAZZI_API,u=new URLSearchParams(location.search).get("u")||"",esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 if(!u){root.innerHTML="<div class='empty-state' style='margin:60px 0'><h3>No contributor selected.</h3></div>";return;}
 const res=await api.getPublicProfile(u);if(res.error||!res.data){root.innerHTML="<div class='empty-state' style='margin:60px 0'><h3>Profile not found.</h3><p>This contributor may have removed their public profile.</p></div>";return;}
 const p=res.data.profile,articles=res.data.articles||[];document.title=p.display_name+" — PAPARAZZI🇬🇲";const desc=document.querySelector('meta[name="description"]');if(desc)desc.content=(p.bio||"PAPARAZZI contributor")+" · "+articles.length+" published stories.";
 const social=[["Instagram",p.instagram],["Facebook",p.facebook],["TikTok",p.tiktok],["YouTube",p.youtube],["Website",p.website_url],["X",p.x_handle]].filter(x=>x[1]);
 const avatar=p.avatar_url?"<img src='"+esc(p.avatar_url)+"' alt='"+esc(p.display_name)+"' class='author-avatar-img'>":"<div class='author-avatar-fallback'>"+esc((p.display_name||"P")[0])+"</div>";
 root.innerHTML="<section class='author-hero'><div class='author-avatar'>"+avatar+"</div><div class='author-copy'><div class='eyebrow'>PAPARAZZI CONTRIBUTOR</div><h1>"+esc(p.display_name)+"</h1><div class='author-handle'>@"+esc(p.username)+" · "+articles.length+" published "+(articles.length===1?"story":"stories")+"</div><p>"+esc(p.bio||"Reporting from The Gambia.")+"</p><div class='pill-row'>"+(p.beats||[]).map(x=>"<span class='pill'>"+esc(x)+"</span>").join("")+"</div><div class='social-row'>"+social.map(x=>"<a href='"+esc(x[1])+"' target='_blank' rel='noopener noreferrer'>"+esc(x[0])+" ↗</a>").join("")+"</div><div class='author-actions'><button id='follow-author' class='btn btn-dark'>Follow "+esc(p.display_name)+" →</button><a class='btn btn-ghost' href='submit.html'>Send a tip</a></div></div></section><section class='author-stories'><div class='section-head'><div><div class='eyebrow'>THE ARCHIVE</div><h2>Stories by "+esc(p.display_name)+"</h2></div></div><div class='latest-list'>"+articles.map((a,i)=>"<a class='latest-item' href='story.html?slug="+encodeURIComponent(a.slug)+"'><span class='latest-index'>"+String(i+1).padStart(2,"0")+"</span><div class='latest-thumb'>"+(a.cover_url?"<img src='"+esc(a.cover_url)+"' alt='"+esc(a.title)+"'>":"")+"</div><div class='latest-info'><div class='kicker'>"+esc(a.category||"Story")+"</div><h3>"+esc(a.title)+"</h3><p>"+esc(a.excerpt||"")+"</p><div class='meta'><span>"+new Date(a.published_at||a.created_at).toLocaleDateString("en-GB")+"</span></div></div><div class='latest-side'><span class='read'>READ →</span></div></a>").join("")+"</div></section>";
 const session=(await api.auth.getSession()).data.session,follow=document.querySelector("#follow-author");if(!session){follow.onclick=()=>location.href="join.html";return;}const following=(await api.getFollowing()).data||[],isFollowing=following.some(x=>x.username===p.username);follow.textContent=isFollowing?"Following ✓":"Follow "+p.display_name+" →";follow.onclick=async()=>{follow.disabled=true;const r=isFollowing?await api.unfollow(p.username):await api.follow(p.username);if(!r.error)location.reload();else{alert(r.error.message);follow.disabled=false;}};
});

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><title>Notifications — PAPARAZZI🇬🇲</title></head><body data-page="notifications"><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><div class="brand-mark">PZ</div><div class="brand-copy"><div class="brand-name">PAPARAZZI🇬🇲</div><div class="brand-sub">Notifications</div></div></a><nav class="nav"><a href="index.html">HOME</a><a href="why-join.html">WHY JOIN</a><a href="submit.html">SEND A TIP</a><a id="account-link" class="nav-cta" href="join.html">SIGN IN</a></nav></div></header><main><div class="container"><section class="page-head"><div class="eyebrow">YOUR INBOX</div><h1>Stay close to the <em>stories.</em></h1><p>When a contributor you follow publishes, it appears here. Email delivery is controlled separately.</p></section><section class="studio-grid"><section class="panel"><div class="section-head"><h2>Notifications</h2><button id="read" class="btn btn-ghost">Mark all read</button></div><div id="list"><div class="empty-state">Loading…</div></div></section><aside class="panel"><div class="eyebrow">EMAIL</div><h2>Delivery preferences.</h2><label class="check"><input id="following" type="checkbox"> Email me when contributors I follow publish.</label><label class="check"><input id="all" type="checkbox"> Email me every new PAPARAZZI post.</label><button id="save" class="btn btn-dark">Save preferences →</button><div id="status" class="status-box"></div></aside></section></div></main><footer class="footer"><div class="container"><div class="footer-bottom"><span>© 2026 PAPARAZZI🇬🇲</span><span><a href="why-join.html">Why join</a> · <a href="privacy.html">Privacy</a></span></div></div></footer><script src="config.js?v=13"></script><script src="api.js?v=13"></script><script src="app.js?v=13"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{const api=window.PAPARAZZI_API,$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const session=(await api.auth.getSession()).data.session;if(!session){location.href="join.html";return;}const p=(await api.getMyProfile()).data;$("#account-link").textContent=p?.is_paparazzi?"STUDIO":"ACCOUNT";$("#account-link").href=p?.is_paparazzi?"studio.html":"index.html";async function load(){const r=await api.getNotifications(),rows=r.data||[];$("#list").innerHTML=r.error?"<div class='empty-state'>"+esc(r.error.message)+"</div>":rows.length?rows.map(n=>"<a class='article-item "+(n.read_at?"":"notification-unread")+"' href='"+(n.article_id?"story.html?id="+encodeURIComponent(n.article_id):"notifications.html")+"'><div><strong>"+esc(n.title)+"</strong><p>"+esc(n.body)+"</p><small>"+new Date(n.created_at).toLocaleString("en-GB")+"</small></div></a>").join(""):"<div class='empty-state'><h3>Nothing yet.</h3><p>Follow a PAPARAZZI contributor to start receiving updates.</p></div>";}const pref=(await api.getNotificationPreferences()).data||{};$("#following").checked=!!pref.following_email;$("#all").checked=!!pref.all_paparazzi_email;load();$("#read").onclick=async()=>{await api.markNotificationsRead();load();};$("#save").onclick=async()=>{const r=await api.updateNotificationPreferences({site_notifications:true,following_email:$("#following").checked,all_paparazzi_email:$("#all").checked});$("#status").textContent=r.error?r.error.message:"Preferences saved.";$("#status").className="status-box show "+(r.error?"error":"ok");};});
